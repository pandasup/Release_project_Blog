{% for m in article.media.all %}
  <figure class="mb-3" style="max-width: 640px;">
    <div class="ratio ratio-16x9 bg-light rounded overflow-hidden">
      {% if m.media_type == 'image' %}
        <img src="{{ m.file.url }}" class="object-fit-contain"
             alt="{{ m.caption|default:article.title }}" loading="lazy">
      {% else %}
        <video controls preload="metadata" class="object-fit-contain">
          <source src="{{ m.file.url }}">
          Ваш браузер не підтримує відео.
        </video>
      {% endif %}
    </div>
    {% if m.caption %}
      <figcaption class="text-muted small mt-1">{{ m.caption }}</figcaption>
    {% endif %}
  </figure>
{% endfor %}

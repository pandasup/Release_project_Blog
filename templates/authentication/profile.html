<h1>{{ user.username }}</h1>
<p>{{ user.get_full_name }} · {{ user.email }}</p>
<p>Роль: {{ user.get_role_display }}</p>
{% if user.avatar %}<img src="{{ user.avatar.url }}" width="120" alt="Аватар">{% endif %}
<p>{{ user.bio }}</p>
<a href="{% url 'authentication:profile_edit' %}">Редагувати профіль</a>
<a href="{% url 'authentication:password_change' %}">Змінити пароль</a>
